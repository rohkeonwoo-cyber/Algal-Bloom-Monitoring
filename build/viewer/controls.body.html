  <h2>보기</h2>
  <div class="ctl">
    <label for="vex">수직과장</label>
    <input type="range" id="vex" min="1" max="12" step="1" value="3">
    <span class="val mono" id="vexVal">3×</span>
  </div>
  <div class="ctl">
    <label for="vwOn">항공영상</label>
    <button id="vwOn" style="flex:1; all:unset; cursor:pointer; text-align:center;
            border:1px solid var(--border); border-radius:7px; padding:4px 6px;
            font-size:11.5px; background:var(--surface-2); color:var(--ink-1);"
            aria-pressed="false">브이월드 0.24 m</button>
  </div>
  <div class="ctl" style="justify-content:space-between">
    <span id="vwStat" style="font-size:10.5px; line-height:1.5">–</span>
  </div>

  <div class="ctl">
    <label for="mres">지형 해상도</label>
    <select id="mres" style="flex:1; background:var(--surface-2); color:var(--ink-1);
            border:1px solid var(--border); border-radius:7px; padding:4px 6px; font-size:11.5px;">
      <option value="1">30 m (원본)</option>
      <option value="2">60 m (가벼움)</option>
      <option value="3">90 m (매우 가벼움)</option>
    </select>
  </div>
  <div class="ctl">
    <label for="dlim">본류 거리</label>
    <input type="range" id="dlim" min="1" max="15" step="1" value="15">
    <span class="val mono" id="dlimVal">15km</span>
  </div>
  <div class="ctl">
    <label for="opa">물 진하기</label>
    <input type="range" id="opa" min="30" max="100" step="5" value="100">
    <span class="val mono" id="opaVal">100</span>
  </div>

  <div class="ctl">
    <label for="bldOn">건물</label>
    <button id="bldOn" style="flex:1; all:unset; cursor:pointer; text-align:center;
      padding:5px 0; border:1px solid var(--border); border-radius:7px;
      background:var(--surface-2); font-size:12px;" aria-pressed="false">3D 건물 켜기</button>
  </div>
  <div class="ctl" style="align-items:flex-start">
    <span id="bldStat" style="font-size:10.5px; line-height:1.5">–</span>
  </div>

  <div class="ctl" style="justify-content:space-between">
    <span>지형 정점</span><span class="val mono" id="vertCount" style="width:auto">–</span>
  </div>
