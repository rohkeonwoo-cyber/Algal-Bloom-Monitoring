name: 실시간 물관리 데이터 갱신

on:
  schedule:
    - cron: "5 * * * *"   # 매시 5분(UTC) — 대략 매시간
  workflow_dispatch: {}    # Actions 탭에서 수동 실행 버튼도 사용 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install requests

      - name: 한강홍수통제소(수위·강수량·홍수예보) 수집
        env:
          HRFCO_KEY: ${{ secrets.HRFCO_KEY }}
        run: python scripts/fetch_hrfco.py

      - name: 조류경보제 최신값 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/fetch_algae.py

      - name: data/*.json 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git diff --staged --quiet || git commit -m "chore: 실시간 데이터 갱신 [skip ci]"
          git push
